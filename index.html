<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Dashboard Pessoal</title>
    <script src="https://cdn.tailwindcss.com"></script> <!--importa o tailwhind css-->
</head>

<body class="relative min-h-screen text-white p-6 overflow-hidden">

    <div class="absolute inset-0 -z-10 bg-[url(./bg-azul.jpg)] bg-no-repeat bg-cover bg-center blur-md scale-105"></div>

    <header class="mb-8 text-center">
        <h1 class="text-4xl font-bold">Painel de Controle</h1>
        <p class="text-gray-400"> Suas informações diárias reunidas</p>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-7xl mx-auto">
        
        <section class="bg-white/15 p-6 rounded-2xl border-2 border-white/20 backdrop-blur-md flex flex-col">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-semibold mb-4">🌤️ Clima</h2>
                <span id="weather-location" class="cursor-pointer text-xs mb-4 p-1 font-medium hover:bg-white/20 bg-white/10 rounded-lg text-slate-300">
                    Carregando...
                </span>
            </div>
            <!-- Esta div está vazia de propósito. O JavaScript vai preenchê-la! -->
            <div id="clima-container" class="flex-1 flex flex-col justify-between">
                <p>Carregando clima...</p>
            </div>
        </section>

        <section class="bg-white/15 p-6 rounded-2xl border-2 border-white/20 backdrop-blur-md">
            <h2 class="text-xl font-semibold mb-4">📰 Notícias</h2>
            
            <div id="noticias-container">
                <p>Carregando notícias...</p>
            </div>
        </section>

        <section class="bg-white/15 p-6 rounded-2xl border-2 border-white/20 backdrop-blur-md">
            <h2 class="text-xl font-semibold mb-4">🏷️ Promoções</h2>
            
            <div id="promocoes-container">
                <p>Carregando promoções...</p>
            </div>
        </section>
        
    </main>

    <script>
            async function carregarClima(){
                await new Promise(resolve=>setTimeout(resolve, 1000));
                
                const dadosAPI = {
                temperatura: 32.0,
                condicao: "Céu Limpo",
                cidade: "Varjota-CE",
                umidade: "20",
                vento: "12",
                chuva: "17"
                };
                
                const containerClima = document.getElementById('clima-container');
                const locationSpan = document.getElementById('weather-location');
                locationSpan.innerText = dadosAPI.cidade;
           
                containerClima.innerHTML = `
                    <div class="p-10 flex flex-col items-center text-center">
                        <div class="text-8xl drop-shadow-[0_0_35px_rgba(250,204,21,0.3)]">☀️</div>
                        <p class="font-semibold p-6 text-sm text-gray-400 mt-3 pt-3">${dadosAPI.condicao}</p>
                        <p class="text-4xl font-bold">${dadosAPI.temperatura}°C</p>
                        
                    </div>
                    <div class= "mt-8 border-t-2 border-white/20 flex items-center justify-center">
                        <p class="font-semibold p-4 text-sm text-gray-200 mt-3 pt-3">Chuva: ${dadosAPI.chuva}%</p>
                        <p class="font-semibold p-4 text-sm text-gray-200 mt-3 pt-3">Umidade: ${dadosAPI.umidade}%</p>
                        <p class="font-semibold p-4 text-sm text-gray-200 mt-3 pt-3">Vento: ${dadosAPI.vento}km/h</p>
                    </div>
                    `;

            }
            carregarClima();

            async function carregarNoticias(){
                await new Promise(resolve=>setTimeout(resolve, 1500));

                const dadosNoticias = [
                    {titulo: "Virginia lança celular próprio", fonte: "Choquei", tempo:"Há 2 horas"},
                    {titulo: "Felca choca o mundo", fonte: "Globo", tempo:"Há 3 horas"},
                    {titulo: "Dedo do Lula cresce novamente", fonte: "Jovem Pan", tempo:"Há 5 horas"},
                    {titulo: "Flávio Bolsonaro rebolou lentinho", fonte: "ICL", tempo:"Há 14 horas"}
                ]

                const containerNoticias = document.getElementById('noticias-container');

                containerNoticias.innerHTML = dadosNoticias.map(noticia => `
                <div class="cursor-pointer bg-black/10 hover:bg-black/20 rounded-2xl mb-4 p-4 border border-white/20">
                    <h3 class="text-md font-semibold text-white/90">${noticia.titulo}</h3>
                    <div class= "flex items-center">
                        <p class="font-semibold text-xs text-gray-300 mt-1">${noticia.fonte} •&nbsp</p>
                        <p class=" text-xs text-gray-300 mt-1"> ${noticia.tempo}</p>
                    </div>
                </div>
                `).join('');
            }
            carregarNoticias();

            async function carregarPromocoes() {
            await new Promise(resolve => setTimeout(resolve, 2000));

            const dadosPromocoes = [
                {
                    produto: "Monitor Gamer Curvo 34\"",
                    precoComDesconto: "R$ 1.899",
                    precoOriginal: "R$ 2.500",
                    loja: "Kabum",
                    tempo: "Há 1h",
                    imagem: "https://images.unsplash.com/photo-1527443154391-507e9dc6c5cc?q=80&w=200&auto=format&fit=crop"
                },
                {
                    produto: "Teclado Mecânico RGB",
                    precoComDesconto: "R$ 299",
                    precoOriginal: "R$ 450",
                    loja: "Pichau",
                    tempo: "Há 3h",
                    imagem: "https://images.unsplash.com/photo-1595225476474-87563907a212?q=80&w=200&auto=format&fit=crop"
                },
                {
                    produto: "Ryzen 5 5500",
                    precoComDesconto: "R$ 499",
                    precoOriginal: "R$ 650",
                    loja: "Kabum",
                    tempo: "Há 4h",
                    imagem: "https://images.kabum.com.br/produtos/fotos/320799/processador-amd-ryzen-5-5500-cache-19mb-3-7ghz-4-2ghz-max-turbo-am4-100-100000457box_1647636796_gg.jpg"
                }
            ];
            
            const containerPromocoes = document.getElementById('promocoes-container');

            // Usamos o map() e join() igual às notícias para gerar vários itens
            containerPromocoes.innerHTML = dadosPromocoes.map(promo => `
                <div class="flex gap-4 mb-4 pb-4 border border-white/20 border-rounded p-4 hover:bg-black/20 rounded-2xl cursor-pointer">
                    
                    <!-- Imagem do Produto -->
                    <img src="${promo.imagem}" alt="${promo.produto}" class="w-20 h-20 object-cover rounded-lg border border-white/10 shrink-0">
                    
                    <!-- Informações (Loja, Tempo, Título e Preços) -->
                    <div class="flex flex-col justify-center">
                        <p class="text-xs text-gray-400 mb-1">${promo.loja} • ${promo.tempo}</p>
                        
                        <h3 class="text-sm font-semibold text-white/90 leading-tight mb-2">${promo.produto}</h3>
                        
                        <div class="flex items-center gap-2">
                            <span class="text-lg font-bold text-green-400">${promo.precoComDesconto}</span>
                            <span class="text-xs text-red-300 line-through">${promo.precoOriginal}</span>
                        </div>
                    </div>

                </div>
            `).join('');
        }
        carregarPromocoes();

    </script>
    
</body>
</html>
